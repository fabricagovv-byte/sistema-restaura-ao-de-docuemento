# Sobe tudo: docker compose up -d --build
# Depois: docker compose exec api python -m licitacoes.cli criar-usuario voce@empresa.com "Seu Nome" senha --papel admin
x-backend: &backend
  build: { context: .., dockerfile: plataforma-licitacoes/backend/Dockerfile }
  env_file: [{ path: .env, required: false }]
  environment:
    LIC_DATABASE_URL: postgresql+psycopg://licit:licit@postgres/licitacoes
    LIC_REDIS_URL: redis://redis:6379/0
    LIC_S3_BUCKET: licitacoes
    LIC_S3_ENDPOINT: http://minio:9000
    LIC_S3_ACCESS_KEY: licit
    LIC_S3_SECRET_KEY: licit-minio-senha
  depends_on: [postgres, redis, minio]
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:0.7.4-pg16
    environment: { POSTGRES_USER: licit, POSTGRES_PASSWORD: licit, POSTGRES_DB: licitacoes }
    volumes: [pgdados:/var/lib/postgresql/data]
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: licit, MINIO_ROOT_PASSWORD: licit-minio-senha }
    volumes: [arquivos:/data]
    ports: ["9001:9001"]
    restart: unless-stopped
  minio-bucket:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "sleep 5 && mc alias set m http://minio:9000 licit licit-minio-senha && mc mb -p m/licitacoes"
  api:
    <<: *backend
    ports: ["8000:8000"]
  worker:
    <<: *backend
    command: celery -A licitacoes.tarefas worker --loglevel=INFO --concurrency=4
  agendador:
    <<: *backend
    command: celery -A licitacoes.tarefas beat --loglevel=INFO
  web:
    build: { context: ./frontend, args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" } }
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped
  opensearch:
    profiles: ["busca"]
    image: opensearchproject/opensearch:2.17.1
    environment: { discovery.type: single-node, DISABLE_SECURITY_PLUGIN: "true", OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g" }
    volumes: [osdados:/usr/share/opensearch/data]

volumes: { pgdados: {}, arquivos: {}, osdados: {} }
