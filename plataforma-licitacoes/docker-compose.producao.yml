# Produção: docker compose -f docker-compose.yml -f docker-compose.producao.yml --env-file producao/.env up -d --build
# Tudo atrás do Caddy (HTTPS automático com Let's Encrypt). Só as portas 80 e 443 ficam abertas.
x-producao: &producao
  env_file: [{ path: producao/.env, required: true }]
  environment:
    LIC_AMBIENTE: producao
    LIC_DATABASE_URL: postgresql+psycopg://licit:${POSTGRES_SENHA:?defina POSTGRES_SENHA}@postgres/licitacoes
    LIC_REDIS_URL: redis://redis:6379/0
    LIC_S3_BUCKET: licitacoes
    LIC_S3_ENDPOINT: http://minio:9000
    LIC_S3_ACCESS_KEY: licit
    LIC_S3_SECRET_KEY: ${MINIO_SENHA:?defina MINIO_SENHA}
    LIC_CORS_ORIGENS: https://${DOMINIO:?defina DOMINIO}
    LIC_EXECUCAO: celery

services:
  postgres:
    environment: { POSTGRES_PASSWORD: "${POSTGRES_SENHA}" }
  minio:
    environment: { MINIO_ROOT_PASSWORD: "${MINIO_SENHA}" }
    ports: !reset []
  minio-bucket:
    entrypoint: >
      sh -c "sleep 5 && mc alias set m http://minio:9000 licit $${MINIO_SENHA} && mc mb -p m/licitacoes"
    environment: { MINIO_SENHA: "${MINIO_SENHA}" }
  api:
    <<: *producao
    ports: !reset []
  worker:
    <<: *producao
  agendador:
    <<: *producao
  web:
    build: { context: ./frontend, args: { NEXT_PUBLIC_API_URL: "https://${DOMINIO}/api" } }
    ports: !reset []
  caddy:
    image: caddy:2.8.4-alpine
    ports: ["80:80", "443:443"]
    environment: { DOMINIO: "${DOMINIO}", EMAIL_CERTIFICADO: "${EMAIL_CERTIFICADO:?defina EMAIL_CERTIFICADO}" }
    volumes: ["./producao/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_dados:/data", "caddy_config:/config"]
    depends_on: [api, web]
    restart: unless-stopped
  backup:
    image: pgvector/pgvector:0.7.4-pg16
    environment: { PGPASSWORD: "${POSTGRES_SENHA}" }
    volumes: ["./producao/backups:/backups", "./producao/backup.sh:/backup.sh:ro"]
    entrypoint: ["sh", "/backup.sh"]
    depends_on: [postgres]
    restart: unless-stopped

volumes: { caddy_dados: {}, caddy_config: {} }
