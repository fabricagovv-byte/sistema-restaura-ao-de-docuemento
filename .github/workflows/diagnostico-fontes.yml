# Diagnóstico rápido das fontes (1 minuto): grava as respostas cruas no branch `diagnostico-fontes`.
name: Diagnóstico das fontes
on:
  push:
    branches: [claude/wizardly-albattani-dn0mei]
    paths: ["plataforma-licitacoes/diagnostico/**", ".github/workflows/diagnostico-fontes.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx
      - run: mkdir saida && python plataforma-licitacoes/diagnostico/fontes.py saida/diagnostico.json
      - name: Publicar
        run: |
          cd saida && git init -q && git checkout -q -b diagnostico-fontes
          git config user.name "coletor-licitacoes" && git config user.email "coletor-licitacoes@users.noreply.github.com"
          git add -A && git commit -q -m "Diagnóstico ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diagnostico-fontes
