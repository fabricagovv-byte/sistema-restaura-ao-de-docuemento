# Busca diária no PNCP em formato WhatsApp: gestão documental e UST.
# Roda no GitHub (não usa crédito do Claude) e publica no branch `busca-diaria`:
#   documental/ultima.txt e ust/ultima.txt -> texto pronto para colar no WhatsApp
#   <tema>/AAAA-MM-DD.txt (e .json)       -> histórico de cada dia
name: Busca diária — documental, UST/PF, fixo mensal e consultoria

on:
  schedule:
    - cron: "17 10 * * *"   # 07:17 em Brasília, todos os dias
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: busca-diaria-documental
  cancel-in-progress: false

jobs:
  busca:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pncp-cli (cópia MIT em vendor/)
        run: |
          pip install ./plataforma-licitacoes/vendor/pncp-cli pypdf
          sudo apt-get install -y -q poppler-utils >/dev/null || true
      - name: Trazer a busca anterior (para marcar as novas)
        run: |
          if git fetch --depth 1 origin busca-diaria; then
            git worktree add /tmp/publicar origin/busca-diaria
          else
            git worktree add --detach /tmp/publicar && git -C /tmp/publicar switch --orphan busca-diaria
          fi
      - name: Buscar no PNCP — gestão documental
        env:
          PYTHONPATH: plataforma-licitacoes/backend
        run: python plataforma-licitacoes/busca-diaria/busca_diaria.py /tmp/publicar/documental documental
      - name: Buscar no PNCP — UST
        if: always()
        env:
          PYTHONPATH: plataforma-licitacoes/backend
        run: python plataforma-licitacoes/busca-diaria/busca_diaria.py /tmp/publicar/ust ust
      - name: Buscar no PNCP — fixo mensal de TI (radar)
        if: always()
        env:
          PYTHONPATH: plataforma-licitacoes/backend
        run: python plataforma-licitacoes/busca-diaria/busca_diaria.py /tmp/publicar/mensal mensal
      - name: Buscar no PNCP — consultoria em tecnologia
        if: always()
        env:
          PYTHONPATH: plataforma-licitacoes/backend
        run: python plataforma-licitacoes/busca-diaria/busca_diaria.py /tmp/publicar/consultoria consultoria
      - name: Buscar no PNCP — serviços de TIC sem produto pronto
        if: always()
        env:
          PYTHONPATH: plataforma-licitacoes/backend
        run: python plataforma-licitacoes/busca-diaria/busca_diaria.py /tmp/publicar/servicos servicos
      - name: Publicar no branch busca-diaria
        if: always()
        working-directory: /tmp/publicar
        run: |
          git config user.name "busca-diaria[bot]"
          git config user.email "busca-diaria@users.noreply.github.com"
          git add -A
          git commit -m "Busca diária $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3 4; do git push origin HEAD:busca-diaria && break; sleep $((i * 10)); git pull --rebase origin busca-diaria || true; done
      - name: Resumo
        if: always()
        run: |
          for t in documental ust mensal consultoria servicos; do [ -f /tmp/publicar/$t/ultima.txt ] && head -5 /tmp/publicar/$t/ultima.txt >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; done
