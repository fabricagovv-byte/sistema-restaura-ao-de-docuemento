# Integração contínua do Sistema de Solicitações Digitais (OS-001, entrega D8-A).
# A cada push ou pull request que mexe em solicitacoes-digitais/: testes no SQLite e no PostgreSQL, conferência do
# contrato OpenAPI e construção da imagem com teste de fumaça (sobe o contêiner e chama /api/v1/saude).
name: Solicitações Digitais — CI

on:
  push:
    paths:
      - "solicitacoes-digitais/**"
      - ".github/workflows/solicitacoes-ci.yml"
  pull_request:
    paths:
      - "solicitacoes-digitais/**"
      - ".github/workflows/solicitacoes-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solicitacoes-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: solicitacoes-digitais

jobs:
  testes:
    name: Testes (${{ matrix.banco }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        banco: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sd
          POSTGRES_PASSWORD: sd-ci
          POSTGRES_DB: sd_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sd -d sd_teste" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: solicitacoes-digitais/requirements.txt
      - run: pip install -r requirements.txt
      - name: Contrato OpenAPI salvo = gerado pelo código
        run: python -m solicitacoes contrato --verificar
      - name: Testes
        env:
          SD_TESTE_PG: ${{ matrix.banco == 'postgresql' && 'postgresql+psycopg://sd:sd-ci@localhost:5432/sd_teste' || '' }}
        run: python -m pytest -v -o addopts="" -p no:cacheprovider

  imagem:
    name: Imagem e teste de fumaça
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - name: Construir a imagem
        run: docker build -t solicitacoes-digitais:ci .
      - name: Subir com PostgreSQL e conferir a saúde
        run: |
          cat > .env <<EOF
          SD_AMBIENTE=producao
          SD_SEGREDO=$(python3 -c "import secrets; print(secrets.token_urlsafe(48))")
          POSTGRES_PASSWORD=$(python3 -c "import secrets; print(secrets.token_urlsafe(24))")
          SD_URL_PUBLICA=http://127.0.0.1:8000
          SD_VERSAO_IMAGEM=ci
          EOF
          docker compose up -d --wait --wait-timeout 180 banco api
          curl -fsS http://127.0.0.1:8000/api/v1/saude
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/solicitacoes)" = "401"
          docker compose exec -T api python -m solicitacoes migrar
      - name: Registros em caso de falha
        if: failure()
        run: docker compose logs --no-color
      - name: Derrubar
        if: always()
        run: docker compose down -v
